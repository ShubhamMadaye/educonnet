<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leaderboard — EduConnect</title>
  <meta name="description" content="See top students and teachers on EduConnect's educational leaderboard. Earn badges and climb the ranks!">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
  <style>
    .lb-layout { max-width: 1000px; margin: 0 auto; }

    .podium {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: var(--sp-4);
      margin-bottom: var(--sp-8);
    }

    .podium-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--sp-3);
    }

    .podium-stand {
      width: 100px;
      border-radius: var(--r-lg) var(--r-lg) 0 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-display);
      font-size: 1.2rem;
      font-weight: 900;
      color: white;
    }

    .podium-stand.gold   { height: 100px; background: linear-gradient(135deg, #f59e0b, #d97706); box-shadow: 0 -4px 20px rgba(245,158,11,0.4); }
    .podium-stand.silver { height: 75px;  background: linear-gradient(135deg, #94a3b8, #64748b); }
    .podium-stand.bronze { height: 55px;  background: linear-gradient(135deg, #b45309, #92400e); }

    .podium-name { font-size: 0.82rem; font-weight: 700; text-align: center; color: var(--text-primary); }
    .podium-pts  { font-size: 0.75rem; color: var(--text-muted); }
    .podium-crown { font-size: 1.5rem; }

    .lb-list {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--r-xl);
      overflow: hidden;
      backdrop-filter: blur(20px);
      padding: var(--sp-2);
    }

    .badges-showcase {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: var(--sp-3);
      margin-top: var(--sp-4);
    }

    .lb-grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-6); }

    @media (max-width: 768px) {
      .lb-grid { grid-template-columns: 1fr; }
      .podium-stand { width: 80px; }
    }
  </style>
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main-content">
      <div class="lb-layout">
        <div class="page-header" style="display:flex;align-items:center;justify-content:space-between;">
          <div>
            <h1>🏆 Leaderboard</h1>
            <p>Top performers in your learning community</p>
          </div>
          <div style="display:flex;gap:var(--sp-2);">
            <button class="chip active" onclick="setLBFilter('all',this)">🌐 Global</button>
            <button class="chip" onclick="setLBFilter('student',this)">👤 Students</button>
            <button class="chip" onclick="setLBFilter('teacher',this)">👨‍🏫 Teachers</button>
          </div>
        </div>

        <!-- My Rank Banner -->
        <div id="my-rank-banner" style="margin-bottom:var(--sp-6);"></div>

        <!-- Podium -->
        <div class="podium" id="podium"></div>

        <div class="lb-grid">
          <!-- Full Leaderboard -->
          <div>
            <div class="section-title">Full Rankings</div>
            <div class="lb-list" id="lb-list"></div>
          </div>

          <!-- Badges + Points -->
          <div>
            <!-- My Progress -->
            <div class="chart-card card card-body" style="margin-bottom:var(--sp-5);" id="my-progress-card"></div>

            <!-- Points to Next Rank -->
            <div class="card card-body" style="margin-bottom:var(--sp-5);" id="next-rank-card"></div>

            <!-- All Badges -->
            <div>
              <div class="section-title">All Badges</div>
              <div class="badges-showcase" id="badges-showcase"></div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    let currentUser, lbFilter = 'all';

    window.addEventListener('DOMContentLoaded', () => {
      currentUser = requireAuth();
      if (!currentUser) return;
      buildSidebar('leaderboard');
      renderAll();
    });

    function setLBFilter(filter, btn) {
      lbFilter = filter;
      document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
      btn.classList.add('active');
      renderAll();
    }

    function renderAll() {
      let lb = getLeaderboard();
      if (lbFilter !== 'all') lb = lb.filter(u => u.role === lbFilter).map((u,i) => ({...u, rank:i+1}));
      renderMyRankBanner(lb);
      renderPodium(lb.slice(0,3));
      renderLBList(lb);
      renderMyProgress(lb);
      renderNextRank(lb);
      renderBadges();
    }

    function renderMyRankBanner(lb) {
      const me = lb.find(u => u.id === currentUser.id);
      if (!me) { document.getElementById('my-rank-banner').innerHTML=''; return; }
      const el = document.getElementById('my-rank-banner');
      const rankEmoji = me.rank === 1 ? '🥇' : me.rank === 2 ? '🥈' : me.rank === 3 ? '🥉' : `#${me.rank}`;
      el.innerHTML = `
        <div class="current-user lb-row" style="background:linear-gradient(135deg,rgba(124,58,237,0.15),rgba(6,182,212,0.08));border-radius:var(--r-xl);border:1px solid rgba(124,58,237,0.3);padding:var(--sp-4) var(--sp-5);">
          <div class="lb-rank" style="font-size:1.3rem;">${rankEmoji}</div>
          <div class="avatar avatar-md" style="background:${me.bg || 'var(--grad-primary)'}">${me.avatar}</div>
          <div class="lb-user">
            <div style="font-weight:700;font-size:0.95rem;color:var(--text-primary);">Your Ranking — ${me.name}</div>
            <div style="font-size:0.78rem;color:var(--text-muted);">${me.subject} • ${me.streak}-day streak 🔥</div>
          </div>
          <div style="text-align:right;">
            <div class="lb-points" style="font-size:1.3rem;">${me.points.toLocaleString()}</div>
            <div style="font-size:0.72rem;color:var(--text-muted);">points</div>
          </div>
        </div>`;
    }

    function renderPodium(top) {
      const el = document.getElementById('podium');
      if (top.length < 2) { el.innerHTML = ''; return; }
      const order = top.length >= 3 ? [top[1], top[0], top[2]] : top;
      const classes = top.length >= 3 ? ['silver','gold','bronze'] : ['gold','silver'];
      const medals  = ['🥈','🥇','🥉'];
      const crowns  = ['','👑',''];

      el.innerHTML = order.map((u, i) => {
        const cls = classes[i];
        return `
          <div class="podium-item animate-fade-in-up" style="animation-delay:${i*0.15}s;">
            ${crowns[i] ? `<div class="podium-crown">${crowns[i]}</div>` : '<div style="height:1.5rem;"></div>'}
            <div class="avatar avatar-lg" style="background:${u.bg || 'var(--grad-primary)'};">${u.avatar}</div>
            <div class="podium-name">${u.name.split(' ')[0]}</div>
            <div class="podium-pts">${u.points.toLocaleString()} pts</div>
            <div class="podium-stand ${cls}">${medals[i]}</div>
          </div>`;
      }).join('');
    }

    function renderLBList(lb) {
      const el = document.getElementById('lb-list');
      el.innerHTML = lb.slice(0,20).map(u => {
        const rankClass = u.rank === 1 ? 'gold' : u.rank === 2 ? 'silver' : u.rank === 3 ? 'bronze' : '';
        const rankLabel = u.rank === 1 ? '🥇' : u.rank === 2 ? '🥈' : u.rank === 3 ? '🥉' : `#${u.rank}`;
        const isMe = u.id === currentUser.id;
        return `
          <a href="profile.html?id=${u.id}" style="text-decoration:none;">
            <div class="lb-row ${isMe ? 'current-user' : ''}">
              <div class="lb-rank ${rankClass}">${rankLabel}</div>
              <div class="avatar avatar-sm" style="background:${u.bg || 'var(--grad-primary)'}">${u.avatar}</div>
              <div class="lb-user">
                <div style="font-size:0.875rem;font-weight:600;color:var(--text-primary);">${u.name} ${isMe ? '<span style="font-size:0.68rem;color:var(--primary-light);">(You)</span>':''}</div>
                <div style="font-size:0.72rem;color:var(--text-muted);">${u.subject} • 🔥 ${u.streak} days</div>
              </div>
              <div style="text-align:right;">
                <div class="lb-points">${u.points.toLocaleString()}</div>
                <div style="display:flex;gap:4px;justify-content:flex-end;margin-top:4px;">${(u.badges||[]).slice(0,3).map(bid => { const a=ACHIEVEMENTS_LIST.find(ac=>ac.id===bid); return a?`<span title="${a.name}" style="font-size:0.85rem;">${a.icon}</span>`:''; }).join('')}</div>
              </div>
            </div>
          </a>`;
      }).join('');
    }

    function renderMyProgress(lb) {
      const me = lb.find(u => u.id === currentUser.id);
      if (!me) return;
      const el = document.getElementById('my-progress-card');
      el.innerHTML = `
        <div style="display:flex;align-items:center;gap:var(--sp-3);margin-bottom:var(--sp-4);">
          <i class="ph ph-star" style="color:var(--warning);font-size:1.2rem;"></i>
          <span style="font-weight:700;">My Progress</span>
        </div>
        <div style="display:flex;gap:var(--sp-5);">
          <div class="stat-item"><div class="stat-value">${me.points}</div><div class="stat-label">Points</div></div>
          <div class="stat-item"><div class="stat-value">#${me.rank}</div><div class="stat-label">Rank</div></div>
          <div class="stat-item"><div class="stat-value">${me.streak}</div><div class="stat-label">Streak</div></div>
          <div class="stat-item"><div class="stat-value">${(me.badges||[]).length}</div><div class="stat-label">Badges</div></div>
        </div>
        <div style="margin-top:var(--sp-4);">
          <div class="streak-display">
            <div class="streak-flame">🔥</div>
            <div>
              <div class="streak-count">${me.streak}</div>
              <div style="font-size:0.8rem;color:var(--text-muted);">day streak</div>
            </div>
          </div>
        </div>`;
    }

    function renderNextRank(lb) {
      const myIdx = lb.findIndex(u => u.id === currentUser.id);
      if (myIdx <= 0) { document.getElementById('next-rank-card').innerHTML = `<div style="text-align:center;padding:var(--sp-4);"><div style="font-size:2rem;">👑</div><div style="font-weight:700;margin-top:var(--sp-2);">You're #1!</div><div style="font-size:0.82rem;color:var(--text-muted);margin-top:var(--sp-1);">Keep it up and maintain the top spot!</div></div>`; return; }
      const me   = lb[myIdx];
      const above= lb[myIdx-1];
      const diff = above.points - me.points;
      const pct  = Math.round((me.points / above.points) * 100);
      const el = document.getElementById('next-rank-card');
      el.innerHTML = `
        <div style="font-weight:700;margin-bottom:var(--sp-3);display:flex;align-items:center;gap:var(--sp-2);"><i class="ph ph-target" style="color:var(--accent);"></i> Next Rank Target</div>
        <div style="display:flex;align-items:center;gap:var(--sp-3);margin-bottom:var(--sp-3);">
          <div class="avatar avatar-sm" style="background:${above.bg || 'var(--grad-primary)'}">${above.avatar}</div>
          <div>
            <div style="font-weight:600;font-size:0.875rem;">${above.name}</div>
            <div style="font-size:0.72rem;color:var(--text-muted);">#${above.rank} • ${above.points} pts</div>
          </div>
        </div>
        <div style="margin-bottom:var(--sp-2);display:flex;justify-content:space-between;font-size:0.78rem;color:var(--text-muted);">
          <span>Gap to beat</span><span style="color:var(--danger);font-weight:600;">-${diff} pts</span>
        </div>
        <div class="progress-bar">
          <div class="progress-fill" style="width:${pct}%;"></div>
        </div>
        <div style="font-size:0.75rem;color:var(--text-muted);margin-top:var(--sp-2);">Earn ${diff} more points to reach rank #${above.rank}!</div>`;
    }

    function renderBadges() {
      const el = document.getElementById('badges-showcase');
      const earned = currentUser.badges || [];
      el.innerHTML = ACHIEVEMENTS_LIST.map(a => `
        <div class="achievement-badge ${earned.includes(a.id) ? '' : 'locked'}">
          <div class="achievement-icon">${a.icon}</div>
          <div class="achievement-name">${a.name}</div>
          <div class="achievement-desc">${a.desc}</div>
          <span class="badge badge-${earned.includes(a.id)?'success':'primary'}" style="font-size:0.62rem;">${earned.includes(a.id) ? '✓ Earned' : '+' + a.points + ' pts'}</span>
        </div>`).join('');
    }
  </script>
</body>
</html>
